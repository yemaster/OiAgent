name: Cross-platform tests

on:
  pull_request:
    paths:
      [
        "src-tauri/**",
        "src/lib/terminal*.ts",
        "src/components/workspace/TerminalView.tsx",
        "src/hooks/useNativeMenu.ts",
        "tests/terminal*",
        "tests/native-menu.test.ts",
        "package*.json",
        ".github/workflows/cross-platform.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "src-tauri/**",
        "src/lib/terminal*.ts",
        "src/components/workspace/TerminalView.tsx",
        "src/hooks/useNativeMenu.ts",
        "tests/terminal*",
        "tests/native-menu.test.ts",
        "package*.json",
        ".github/workflows/cross-platform.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Test native and PTY argument round trips
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib argv_tests -- --nocapture
      - name: Test shutdown ownership and descendant cleanup
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib shutdown -- --nocapture
      - name: Test attachment protocols and storage
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib attachments::tests
      - name: Test version probes and detection diagnostics
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib discovery::version_tests
      - name: Test merged settings and cleanup
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib launch_settings::tests
      - name: Test selected Claude API configuration precedence
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib providers::tests
      - name: Test local encrypted storage and LLM compatibility
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib local_secret_store::tests
          cargo test --manifest-path src-tauri/Cargo.toml --lib llm_settings::tests
      - name: Test single-file runner paths and compile guards
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib file_run::tests
      - name: Test scheduled dispatch and timezone boundaries
        run: "cargo test --manifest-path src-tauri/Cargo.toml --lib schedules::"
      - name: Test terminal output chunks
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib terminal::output_tests
      - name: Test terminal transcript import and synchronization
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib terminal_history::tests
      - run: npm ci
      - name: Test terminal replay, clipboard and native menu routing
        run: npx vitest run tests/terminal-session.test.ts tests/terminal-clipboard.test.ts tests/native-menu.test.ts tests/terminal-sync.test.tsx --maxWorkers=2
